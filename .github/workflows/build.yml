name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Instalar Flet y compilar APK
        run: |
          pip install flet
          flet build apk --project "MiMusica" --description "Descargador de musica"
      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-APK
          path: build/apk/*.apk

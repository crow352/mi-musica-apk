name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar APK con Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
